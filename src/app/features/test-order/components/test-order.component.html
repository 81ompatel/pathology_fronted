<div class="container">
  <div class="glass-card">
    <h2>Create Test Order</h2>
    <div *ngIf="message" class="toast">{{ message }}</div>
    
    <form [formGroup]="orderForm" (ngSubmit)="onSubmit()" class="form-grid">
      <div class="form-group">
        <label>Patient Name</label>
        <input type="text" formControlName="patientName" placeholder="e.g. John Doe">
      </div>
      
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" formControlName="phoneNumber" placeholder="10-digit number">
      </div>
      
      <div class="form-group">
        <label>Select Test</label>
        <select formControlName="testMasterId">
          <option value="">-- Select Test --</option>
          <option *ngFor="let test of tests" [value]="test.id">
            {{ test.testName }} (₹{{ test.price }})
          </option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="orderForm.invalid">Place Order</button>
      </div>
    </form>
  </div>

  <div class="glass-card mt-4">
    <h2>Today's Orders</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Patient Name</th>
            <th>Phone</th>
            <th>Test</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of todaysOrders">
            <td><span class="badge">{{ order.orderNumber }}</span></td>
            <td>{{ order.patientName }}</td>
            <td>{{ order.phoneNumber }}</td>
            <td>{{ order.testMaster?.testName }}</td>
            <td>{{ order.orderDate | date:'shortTime' }}</td>
          </tr>
          <tr *ngIf="todaysOrders.length === 0">
            <td colspan="5" class="text-center">No orders today.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
